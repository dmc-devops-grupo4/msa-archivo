spring.application.name=archivo-api
server.port=${SERVER_PORT:8087}

#carpeta para subir archivo
file.upload-dir=${FILE_UPLOAD_DIR:C:/archivos}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#utilizando un servidor embebido como Tomcat, configurar los límites de carga en el servidor:
server.tomcat.max-http-post-size=10000000

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_archivo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true
