spring.application.name=archivo-api
server.port=8087

#carpeta para subir archivo
file.upload-dir=C:/archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
#utilizando un servidor embebido como Tomcat, configurar los límites de carga en el servidor:
server.tomcat.max-http-post-size=10000000

#Data Source Properties
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_archivo
spring.datasource.username=root
spring.datasource.password=

#JPA Properties
spring.jpa.database=MYSQL
spring.jpa.properties.hibernate.format_sql=TRUE
spring.jpa.hibernate.ddl-auto=none

#Swagger
springdoc.api.docs.path=/api-docs
springdoc.swagger-ui.path=/actuator/info
springdoc.swagger-ui.enabled=true

#Eureka Client
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka